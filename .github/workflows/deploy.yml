# Triggers on every push to main, but ONLY runs after the CI workflow
# has finished successfully - so a broken build never gets deployed.
#
# Required GitHub secrets (repo Settings > Secrets and variables >
# Actions):
#   RENDER_DEPLOY_HOOK_URL  - Render dashboard > chat-backend service >
#                             Settings > Deploy Hook (copy the URL)
#   VERCEL_TOKEN            - Vercel dashboard > Account Settings > Tokens
#   VERCEL_ORG_ID           - Vercel project > Settings > General
#   VERCEL_PROJECT_ID       - Vercel project > Settings > General
#
# NOTE: Vercel also auto-deploys on push if you connect the repo
# directly in Vercel's own dashboard - that alone is enough for most
# setups and needs none of the Vercel secrets above. This workflow's
# Vercel step is only useful if you specifically want the deploy gated
# behind this repo's CI passing first, instead of Vercel's own build.

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

jobs:
  deploy-backend:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-frontend:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: frontend
