# One-command local/staging deploy:
# docker compose up --build
#
# Needs backend/.env to exist first
# (copy from backend/.env.example).

services:

  # --------------------------------------------------
  # Redis
  # --------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data


  # --------------------------------------------------
  # Backend
  # --------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    restart: unless-stopped

    ports:
      # Host 8000 -> Container 10000
      - "8000:10000"

    env_file:
      - backend/.env

    environment:
      # Docker Compose Redis hostname
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Redis URL for the application
      REDIS_URL: redis://redis:6379

    depends_on:
      - redis

    volumes:
      - chroma-data:/app/backend/app/vectorstore/chroma_db
      - uploads-data:/app/backend/uploads


  # --------------------------------------------------
  # Frontend
  # --------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

      args:
        VITE_API_URL: http://localhost:8000

    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend


# --------------------------------------------------
# Persistent Docker volumes
# --------------------------------------------------
volumes:
  redis-data:
  chroma-data:
  uploads-data: